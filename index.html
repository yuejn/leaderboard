<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- Lets the script ask the stylesheet which layout is active, so the narrow
       breakpoint is written down in exactly one place. See style.css. -->
  <div id="width-probe" aria-hidden="true"></div>

  <h1>quiz night leaderboard</h1>
  <p class="lede">pls don't question the maths too much on this; i'm a history major</p>
  <p class="meta" id="meta"></p>

  <p class="message" id="message" role="status" aria-live="polite">loading&hellip;</p>

  <search class="controls" id="controls" hidden>
    <p class="control">
      <label for="filter">filter:</label>
      <input type="search" id="filter" autocomplete="off" spellcheck="false"
             aria-label="filter by initials or country">
      <button type="button" id="clear-filter" hidden aria-label="clear the filter">&times;</button>
    </p>
    <p class="control">
      <span id="show-label">show:</span>
      <span class="show" id="show" role="group" aria-labelledby="show-label"></span>
    </p>
    <p class="control sort-mobile">
      <label for="sort-select">sort by&hellip;</label>
      <select id="sort-select"></select>
    </p>
    <p class="control pins" id="pins" hidden></p>
    <p class="legend" id="legend"></p>
  </search>

  <table id="table" hidden>
    <caption class="visually-hidden">Leaderboard standings</caption>
    <colgroup><col><col><col><col><col></colgroup>
    <thead id="thead">
      <tr>
        <th scope="col" data-key="rank"><button type="button">rank</button></th>
        <th scope="col" data-key="initials"><button type="button">initials</button></th>
        <th scope="col" data-key="country"><button type="button">country</button></th>
        <th scope="col" data-key="score"><button type="button">track record</button></th>
        <th scope="col" data-key="status"><button type="button">status</button></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="hint" id="hint" hidden></p>

  <nav class="pager" id="pager" aria-label="pagination" hidden>
    <button type="button" id="prev">&laquo; prev</button>
    <span class="pager-status" id="pager-status"></span>
    <button type="button" id="next">next &raquo;</button>
  </nav>

  <p class="count" id="count" aria-live="polite"></p>

  <details class="stats" id="stats" hidden>
    <summary>stats</summary>
    <p class="stats-line" id="stats-summary"></p>
    <pre class="histogram" id="histogram"></pre>
    <p class="stats-line" id="stats-countries"></p>
    <p class="stats-note" id="stats-note" hidden></p>
  </details>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
